# Compose file used by the Koyeb deployment (see Dockerfile.koyeb).
#
# Koyeb provides/injects:
#   - PORT (the exposed port)
#   - secrets: DATABASE_URL, SESSION_SECRET, GOOGLE_CLIENT_ID,
#     GOOGLE_CLIENT_SECRET, MAP_API_KEY, DOCKERHUB_* (optional)
#   - values: GOOGLE_REDIRECT_URL, GOOGLE_API_REDIRECT_URL, FRONTEND_URL,
#     COOKIE_* (must point at the public Koyeb domain)
#
# Migrations run automatically from the API container's entrypoint.
#
# TEMPORARY: only the API service is enabled to isolate backend startup on a
# small instance. The `web` (nginx) service and same-origin proxy will be
# restored once the backend is confirmed to run.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "8082"
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_API_REDIRECT_URL: ${GOOGLE_API_REDIRECT_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      MAP_API_KEY: ${MAP_API_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    ports:
      - "${PORT}:8082"
