services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zero_climbing
      POSTGRES_PASSWORD: zero_climbing
      POSTGRES_DB: zero_climbing
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_climbing -d zero_climbing"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://zero_climbing:zero_climbing@postgres:5432/zero_climbing?sslmode=disable
      PORT: "8082"
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: http://localhost:8080/auth/google/callback
      GOOGLE_API_REDIRECT_URL: http://localhost:8080/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:8080
      MAP_API_KEY: ${MAP_API_KEY:-}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
